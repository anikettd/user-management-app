<div class="form-container">

  <h2>{{ isEditMode ? '✏️ Edit User' : '➕ Add New User' }}</h2>

  <div *ngIf="loading" class="loading">⏳ Loading...</div>
  <div *ngIf="successMessage" class="success-message">✅ {{ successMessage }}</div>
  <div *ngIf="error" class="error-message">❌ {{ error }}</div>

  <form #userForm="ngForm" (ngSubmit)="onSubmit()">

    <div class="form-group">
      <label for="name">👤 Name *</label>
      <input type="text" id="name" name="name" [(ngModel)]="user.name"
        #nameRef="ngModel" required minlength="2" placeholder="Enter name" class="form-input">
      <div *ngIf="nameRef.invalid && (nameRef.dirty || nameRef.touched)" class="validation-error">
        <small *ngIf="nameRef.errors?.['required']">Name is required.</small>
        <small *ngIf="nameRef.errors?.['minlength']">Name must be at least 2 characters.</small>
      </div>
    </div>

    <div class="form-group">
      <label for="email">📧 Email *</label>
      <input type="email" id="email" name="email" [(ngModel)]="user.email"
        #emailRef="ngModel" required email placeholder="Enter email" class="form-input">
      <div *ngIf="emailRef.invalid && (emailRef.dirty || emailRef.touched)" class="validation-error">
        <small *ngIf="emailRef.errors?.['required']">Email is required.</small>
        <small *ngIf="emailRef.errors?.['email']">Please enter a valid email.</small>
      </div>
    </div>

    <div class="form-group">
      <label for="age">🎂 Age *</label>
      <input type="number" id="age" name="age" [(ngModel)]="user.age"
        #ageRef="ngModel" required min="1" max="120" placeholder="Enter age" class="form-input">
      <div *ngIf="ageRef.invalid && (ageRef.dirty || ageRef.touched)" class="validation-error">
        <small *ngIf="ageRef.errors?.['required']">Age is required.</small>
        <small *ngIf="ageRef.errors?.['min']">Age must be at least 1.</small>
        <small *ngIf="ageRef.errors?.['max']">Age must be at most 120.</small>
      </div>
    </div>

    <div class="form-group checkbox-group">
      <label>
        <input type="checkbox" name="isActive" [(ngModel)]="user.isActive">
        ✅ Active User
      </label>
    </div>

    <div class="form-actions">
      <button type="submit" [disabled]="userForm.invalid || loading" class="submit-btn">
        {{ isEditMode ? '💾 Update' : '💾 Save' }}
      </button>
      <button type="button" (click)="onReset()" class="reset-btn">🔄 Reset</button>
      <a routerLink="/users" class="cancel-btn">❌ Cancel</a>
    </div>

  </form>
</div>
